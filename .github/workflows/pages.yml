name: Refresh map data and deploy Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MAP_EXPORT_URL: "https://script.google.com/macros/s/AKfycbxzmL1KFlWZ2Ch-9FCM_Zel7y0Pd2e7dJiyBNsTYf7A_SBYkNUMGpGewaMwESn2vps/exec?view=map-export"
  MAP_HEALTH_URL: "https://script.google.com/macros/s/AKfycbxzmL1KFlWZ2Ch-9FCM_Zel7y0Pd2e7dJiyBNsTYf7A_SBYkNUMGpGewaMwESn2vps/exec?view=health"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh public map snapshot
        shell: bash
        run: |
          set -u
          success=0

          for attempt in 1 2 3 4 5 6; do
            echo "Map export attempt ${attempt}/6"
            rm -f /tmp/map-data.raw.json /tmp/map-data.valid.json

            curl_rc=0
            http_code="$(curl \
              --location \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 180 \
              --write-out '%{http_code}' \
              "${MAP_EXPORT_URL}&_=$(date +%s)" \
              --output /tmp/map-data.raw.json)" || curl_rc=$?

            echo "Apps Script HTTP ${http_code:-000}, curl rc=${curl_rc}"

            if [ "${curl_rc}" -eq 0 ] && [ "${http_code}" -ge 200 ] 2>/dev/null && [ "${http_code}" -lt 300 ] 2>/dev/null && python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/map-data.raw.json')
          target = Path('/tmp/map-data.valid.json')

          if not source.exists() or source.stat().st_size == 0:
              raise SystemExit('empty response')

          try:
              data = json.loads(source.read_text(encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f'invalid JSON: {exc}')

          if not isinstance(data, dict):
              raise SystemExit('root is not an object')
          if data.get('error'):
              raise SystemExit('Apps Script returned: ' + str(data.get('error')))
          if not str(data.get('schema', '')).startswith('sklad24-map-'):
              raise SystemExit('unexpected schema')
          if not data.get('generatedAt'):
              raise SystemExit('generatedAt is missing')
          if not isinstance(data.get('points'), list):
              raise SystemExit('points is not a list')
          if not isinstance(data.get('summary'), dict):
              raise SystemExit('summary is not an object')

          enabled = data.get('enabled', True) is not False
          total = int(data['summary'].get('total') or 0)
          mapped = int(data['summary'].get('mapped') or 0)
          points = len(data['points'])
          if enabled:
              if total <= 0:
                  raise SystemExit('snapshot contains zero cards')
              if mapped != points:
                  raise SystemExit(f'mapped={mapped} but points={points}')
              if points <= 0:
                  raise SystemExit('snapshot contains zero mapped points')
          else:
              if points != 0 or mapped != 0:
                  raise SystemExit('disabled snapshot must not publish map points')

          target.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(f'Validated snapshot: enabled={enabled}, total={total}, mapped={mapped}, points={points}')
          PY
            then
              mv /tmp/map-data.valid.json map-data.json
              echo "S24_MAP_REFRESHED=1" >> "$GITHUB_ENV"
              success=1
              break
            fi

            if [ -s /tmp/map-data.raw.json ]; then
              echo "Response preview:"
              head -c 600 /tmp/map-data.raw.json || true
              echo
            fi
            sleep 15
          done

          if [ "${success}" -ne 1 ]; then
            echo "::warning::Apps Script export failed; validating the last committed good snapshot."
            echo "Health endpoint (diagnostic only):"
            curl --location --silent --show-error --connect-timeout 10 --max-time 30 "${MAP_HEALTH_URL}&_=$(date +%s)" | head -c 600 || true
            echo

            python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('map-data.json')
          if not p.exists():
              raise SystemExit('No committed map-data.json fallback exists')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('error'):
              raise SystemExit('Committed fallback contains an error')
          if not data.get('generatedAt'):
              raise SystemExit('Committed fallback has never been populated')
          if not isinstance(data.get('points'), list):
              raise SystemExit('Committed fallback points is not a list')
          if not isinstance(data.get('summary'), dict):
              raise SystemExit('Committed fallback summary is invalid')
          enabled = data.get('enabled', True) is not False
          if enabled:
              if not data['points']:
                  raise SystemExit('Committed fallback has no map points')
              if int(data['summary'].get('total') or 0) <= 0:
                  raise SystemExit('Committed fallback has no cards')
          else:
              if data['points'] or int(data['summary'].get('mapped') or 0) != 0:
                  raise SystemExit('Committed disabled fallback unexpectedly publishes points')
          print('Using committed last-known-good snapshot: enabled=', enabled, 'points=', len(data['points']))
          PY
          fi

      - name: Persist last-known-good snapshot
        if: env.S24_MAP_REFRESHED == '1'
        shell: bash
        run: |
          if git diff --quiet -- map-data.json; then
            echo "Snapshot did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-data.json
          git commit -m "Refresh map data snapshot [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
