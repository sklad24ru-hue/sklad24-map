<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#243746">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://tiles.api-maps.yandex.ru" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
  <title>Карта отзывов</title>
  <style>
    :root{--navy:#243746;--orange:#ff7200;--text:#243746;--muted:#71808a;--line:#dfe5e9}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font:13px/1.35 Arial,sans-serif;color:var(--text);background:#fff}
    body{overflow:hidden}.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px}
    .map-wrap{position:relative;min-width:0;background:#edf1f3}#map{position:absolute;inset:0}
    .topbar{position:absolute;z-index:20;left:14px;top:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
    .control{pointer-events:auto;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;box-shadow:0 2px 10px rgba(36,55,70,.08);display:flex;gap:7px;align-items:center}
    .control button{border:0;background:transparent;padding:7px 10px;border-radius:6px;color:var(--text);cursor:pointer;font-weight:700;min-height:34px}
    .control button.active{background:var(--navy);color:#fff}.control label{white-space:nowrap}.control input{accent-color:var(--orange)}
    .sidebar{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-width:0}.side-head{padding:16px 18px;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;font-size:17px}.summary,.status{color:var(--muted);margin-top:5px;font-size:12px}.detail{padding:18px;overflow:auto;min-height:0}
    .empty{color:var(--muted);padding-top:28px;text-align:center}.name{font-size:19px;font-weight:800;margin-bottom:5px}
    .rating{display:flex;align-items:baseline;gap:8px;margin:12px 0}.rating strong{font-size:30px}.rating span{color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;margin:16px 0}.grid div:nth-child(odd){color:var(--muted)}
    .signal{border-radius:8px;padding:10px 12px;background:#fff3d6;color:#76590b;margin:12px 0}
    .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.links a{display:inline-block;text-decoration:none;border-radius:7px;padding:9px 11px;font-weight:700}
    .links .primary{background:var(--orange);color:#fff}.links .secondary{background:#eef2f4;color:var(--text)}
    .marker{min-width:48px;height:38px;border:3px solid #fff;border-radius:21px;box-shadow:0 2px 8px rgba(0,0,0,.25);color:#fff;font:800 14px Arial;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;padding:2px 7px;user-select:none;transform:translate(-50%,-50%)}
    .marker small{font-size:9px;font-weight:600;opacity:.92}.marker.green{background:#3f7d58}.marker.yellow{background:#c69728}.marker.orange{background:#d9772f}.marker.red{background:#b94a43}.marker.none{background:#77848d}
    .marker.selected{outline:3px solid var(--navy);outline-offset:2px;z-index:30}
    .loading{position:absolute;z-index:30;inset:0;background:linear-gradient(145deg,#f7f9fa,#edf2f4);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .18s ease}
    .loading.done{opacity:0;pointer-events:none}.loader-card{width:min(430px,92%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 10px 32px rgba(36,55,70,.10);text-align:center}
    .spinner{width:42px;height:42px;margin:0 auto 16px;border-radius:50%;border:4px solid #e5eaed;border-top-color:var(--orange);animation:spin .8s linear infinite}
    .load-title{font-size:18px;font-weight:800}.load-sub{margin-top:7px;color:var(--muted);min-height:34px}.progress{height:7px;background:#edf1f3;border-radius:10px;overflow:hidden;margin-top:17px}.progress>div{height:100%;width:8%;background:var(--orange);transition:width .25s}
    .error{position:absolute;z-index:40;inset:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;overflow:auto}.hidden{display:none!important}
    .provider{position:absolute;z-index:15;left:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--muted)}
    .yandex-branding{position:absolute;z-index:16;left:0;bottom:0;display:none;line-height:0}.yandex-branding.visible{display:block}.yandex-branding img{display:block;max-height:40px;width:auto}
    .open-in-maps{position:absolute;z-index:16;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 9px;text-decoration:none;color:var(--text);font-weight:700;display:none}.open-in-maps.visible{display:block}
    .fallback-list{position:absolute;z-index:10;inset:0;background:#f5f7f8;padding:76px 14px 14px;overflow:auto}.fallback-grid{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
    .fallback-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;text-align:left;cursor:pointer;color:var(--text);min-height:72px}.fallback-item.selected{outline:3px solid var(--navy);outline-offset:1px}.fallback-item strong{font-size:14px;display:block}.fallback-item span{display:block;margin-top:5px;color:var(--muted);font-size:12px}
    .ol-zoom{top:auto!important;right:10px!important;left:auto!important;bottom:56px!important}.ol-control button{background:rgba(255,255,255,.96)!important;color:var(--text)!important;border:1px solid var(--line)!important}.ol-attribution{display:none!important}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
    @media(max-width:760px){html,body{height:auto;min-height:100%;overflow:auto}.app{display:block;height:auto;min-height:100vh}.map-wrap{height:64vh;min-height:430px}.sidebar{border-left:0;border-top:1px solid var(--line);min-height:36vh}.topbar{left:8px;right:8px;top:8px;gap:6px}.control{max-width:100%;overflow:auto;padding:6px 8px}.control label{font-size:12px}.side-head{padding:13px 15px}.detail{padding:15px}}
  </style>
</head>
<body>
<div class="app">
  <div class="map-wrap">
    <div id="map"></div><div id="fallbackList" class="fallback-list hidden"><div id="fallbackGrid" class="fallback-grid"></div></div>
    <a id="yandexLogo" class="yandex-branding" href="https://yandex.ru/maps/" target="_blank" rel="noopener" aria-label="Яндекс Карты"><img src="assets/yandex-logo.png" alt="Яндекс"></a>
    <a id="openMaps" class="open-in-maps" href="https://yandex.ru/maps/" target="_blank" rel="noopener">Открыть в Картах</a><div id="provider" class="provider hidden"></div>
    <div id="loading" class="loading"><div class="loader-card"><div class="spinner"></div><div id="loadTitle" class="load-title">Подготавливаю карту…</div><div id="loadSub" class="load-sub">Загружаю данные.</div><div class="progress"><div id="loadBar"></div></div></div></div>
    <div class="topbar"><div class="control" id="regions"><button data-region="all" class="active">Вся сеть</button><button data-region="moscow">Москва</button><button data-region="spb">СПб</button></div><div class="control"><label><input id="activeOnly" type="checkbox" checked> Только активные</label><label><input id="below" type="checkbox"> Ниже цели</label><label><input id="low30" type="checkbox"> Есть 1–3★ за 30 дней</label><label><input id="attention" type="checkbox"> Требует внимания</label></div></div><div id="error" class="error hidden"></div>
  </div>
  <aside class="sidebar"><div class="side-head"><div class="brand">КАРТА ОТЗЫВОВ</div><div id="summary" class="summary">Загрузка данных…</div><div id="status" class="status"></div></div><div id="detail" class="detail"><div class="empty">После загрузки выберите объект.</div></div></aside>
</div>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id),REGION_VIEW={moscow:{center:[37.6173,55.7558],zoom:8.8},spb:{center:[30.3159,59.9391],zoom:8.8}},state={data:null,map:null,source:null,overlays:[],selected:null,region:'all',providerNote:''};
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),sleep=ms=>new Promise(r=>setTimeout(r,ms)),setLoad=(t,p,s)=>{$('loadTitle').textContent=t;$('loadBar').style.width=Math.max(5,Math.min(100,Number(p)||0))+'%';$('loadSub').textContent=s||''},providerNote=t=>{state.providerNote=t||'';$('provider').textContent=state.providerNote;$('provider').classList.toggle('hidden',!state.providerNote)};
  const urlFor=p=>'https://yandex.ru/maps/org/'+encodeURIComponent(String(p.id||''))+'/',reviewsUrlFor=p=>urlFor(p)+'reviews/';
  async function loadData(){setLoad('Получаю объекты…',18,'Читаю последний опубликованный снимок.');const r=await fetch('map-data.json',{cache:'no-cache'});if(!r.ok)throw Error('Не удалось получить данные: HTTP '+r.status);const d=await r.json();if(d&&d.error)throw Error(String(d.error));if(!d||!Array.isArray(d.points)||!d.summary)throw Error('Неверный формат данных карты.');return d}
  function applyOptions(){const o=state.data.options||{};$('activeOnly').checked=o.activeOnly!==false;state.region=['all','moscow','spb'].includes(String(o.region))?String(o.region):'all';[...$('regions').querySelectorAll('button[data-region]')].forEach(b=>b.classList.toggle('active',b.dataset.region===state.region))}
  function filtered(){const d=state.data;if(!d)return[];return d.points.filter(p=>{if(state.region!=='all'&&p.region!==state.region)return false;if($('activeOnly').checked&&!p.active)return false;if($('below').checked&&!(p.rating!=null&&p.rating<d.target))return false;if($('low30').checked&&!(Number(p.low30)>0))return false;if($('attention').checked&&!p.attention)return false;return Array.isArray(p.coordinates)&&p.coordinates.length>=2})}
  function updateSummary(points){const sm=state.data.summary||{};$('summary').textContent=points.length+' на карте · '+Number(sm.total||state.data.points.length)+' карточек всего · '+Number(sm.below||0)+' ниже '+Number(state.data.target||4.8).toFixed(1)+'★';const parts=[];if(state.data.generatedAt){const dt=new Date(state.data.generatedAt);parts.push('Данные: '+dt.toLocaleString('ru-RU'))}if(state.providerNote)parts.push(state.providerNote);$('status').textContent=parts.join(' · ')}
  function selectPoint(p){state.selected=p;for(const x of state.overlays)x.el.classList.toggle('selected',String(x.p.id)===String(p.id));for(const x of $('fallbackGrid').querySelectorAll('[data-id]'))x.classList.toggle('selected',x.dataset.id===String(p.id));const rating=p.rating==null?'—':Number(p.rating).toFixed(1)+'★';$('detail').innerHTML='<div class="name">'+esc(p.name)+'</div><div class="rating"><strong>'+rating+'</strong><span>'+(p.reviewCount==null?'нет данных':esc(p.reviewCount)+' отзывов')+'</span></div><div class="grid"><div>Новых за 30 дней</div><b>'+Number(p.new30||0)+'</b><div>1–4★ за 30 дней</div><b>'+Number(p.below5_30||0)+'</b><div>1–3★ за 30 дней</div><b>'+Number(p.low30||0)+'</b><div>1–3★ без ответа</div><b>'+Number(p.lowNo||0)+'</b></div>'+(p.signal?'<div class="signal"><b>'+esc(p.signal)+'</b>'+(p.action?'<br>'+esc(p.action):'')+'</div>':'')+'<div class="links"><a class="primary" href="'+esc(urlFor(p))+'" target="_blank" rel="noopener">Открыть карточку</a><a class="secondary" href="'+esc(reviewsUrlFor(p))+'" target="_blank" rel="noopener">Отзывы</a></div>'}
  function markerElement(p){const el=document.createElement('button');el.type='button';el.className='marker '+(p.band||'none');el.title=p.name||'';el.innerHTML='<span>'+(p.rating==null?'—':Number(p.rating).toFixed(1))+'</span>'+(p.reviewCount==null?'':'<small>'+esc(p.reviewCount)+'</small>');el.addEventListener('click',()=>selectPoint(p));return el}
  function clearOverlays(){if(!state.map){state.overlays=[];return}for(const x of state.overlays){try{state.map.removeOverlay(x.overlay)}catch(_){}}state.overlays=[]}
  function renderList(points){$('fallbackList').classList.remove('hidden');$('fallbackGrid').innerHTML='';for(const p of points){const b=document.createElement('button');b.type='button';b.className='fallback-item';b.dataset.id=String(p.id);b.innerHTML='<strong>'+esc(p.name)+'</strong><span>'+(p.rating==null?'—':Number(p.rating).toFixed(1)+'★')+(p.reviewCount==null?'':' · '+esc(p.reviewCount)+' отзывов')+'</span>';b.addEventListener('click',()=>selectPoint(p));$('fallbackGrid').appendChild(b)}}
  function renderMarkers(){clearOverlays();const points=filtered();$('fallbackList').classList.add('hidden');for(const p of points){const el=markerElement(p),overlay=new ol.Overlay({element:el,position:ol.proj.fromLonLat([Number(p.coordinates[0]),Number(p.coordinates[1])]),positioning:'center-center',stopEvent:true});state.map.addOverlay(overlay);state.overlays.push({overlay,p,el})}updateSummary(points);return points}
  function fitMap(points,animate=true){if(!state.map||!points.length)return;const view=state.map.getView();if(points.length===1){view.animate({center:ol.proj.fromLonLat([Number(points[0].coordinates[0]),Number(points[0].coordinates[1])]),zoom:12,duration:animate?250:0});return}const coords=points.map(p=>ol.proj.fromLonLat([Number(p.coordinates[0]),Number(p.coordinates[1])]));view.fit(ol.extent.boundingExtent(coords),{padding:[78,55,52,45],maxZoom:13,duration:animate?330:0})}
  function imageProbe(src,timeout=5000){return new Promise((resolve,reject)=>{const img=new Image();let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;ok?resolve(src):reject(Error('resource unavailable'))};img.onload=()=>finish(true);img.onerror=()=>finish(false);const timer=setTimeout(()=>finish(false),timeout);img.src=src+(src.includes('?')?'&':'?')+'_='+Date.now()})}
  function tileAt(lon,lat,z){const n=2**z,x=Math.floor((lon+180)/360*n),r=lat*Math.PI/180;return{x,y:Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n),z}}
  function tileTemplate(key){return'https://tiles.api-maps.yandex.ru/v1/tiles/?x={x}&y={y}&z={z}&lang=ru_RU&l=map&projection=web_mercator&apikey='+encodeURIComponent(key)}
  function probeUrl(key){const t=tileAt(37.6173,55.7558,8);return tileTemplate(key).replace('{x}',t.x).replace('{y}',t.y).replace('{z}',t.z)}
  async function initMap(){const key=String(state.data.options?.yandexTilesApiKey||'').trim();if(!key)throw Error('Ключ Яндекс Tiles API не настроен.');await Promise.all([imageProbe('assets/yandex-logo.png',3500),imageProbe(probeUrl(key),5500)]);let tileErrors=0,tileLoads=0;state.source=new ol.source.XYZ({url:tileTemplate(key),projection:'EPSG:3857',crossOrigin:null,referrerPolicy:'strict-origin-when-cross-origin',minZoom:0,maxZoom:20,tileSize:256,wrapX:true,transition:100,tileLoadFunction:(tile,src)=>{const img=tile.getImage();img.removeAttribute('crossorigin');img.referrerPolicy='strict-origin-when-cross-origin';img.src=src}});state.source.on('tileloadend',()=>{tileLoads++});state.source.on('tileloaderror',()=>{tileErrors++;if(tileErrors>=5&&tileLoads===0)setTimeout(()=>showList('Подложка Яндекс недоступна'),0)});state.map=new ol.Map({target:'map',layers:[new ol.layer.Tile({source:state.source,preload:1})],view:new ol.View({center:ol.proj.fromLonLat([37.6173,55.7558]),zoom:8,minZoom:2,maxZoom:18}),controls:[]});providerNote('Яндекс Карты · Tiles API');$('yandexLogo').classList.add('visible');$('openMaps').classList.add('visible')}
  function showList(note){if(state.map){try{state.map.setTarget(null)}catch(_){}state.map=null}clearOverlays();providerNote(note||'Режим списка');$('yandexLogo').classList.remove('visible');$('openMaps').classList.remove('visible');const points=filtered();renderList(points);updateSummary(points)}
  function bind(){$('regions').addEventListener('click',e=>{const b=e.target.closest('button[data-region]');if(!b)return;state.region=b.dataset.region;[...$('regions').querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x===b));state.selected=null;$('detail').innerHTML='<div class="empty">Выберите объект.</div>';if(state.map){const points=renderMarkers();fitMap(points,true)}else{const points=filtered();renderList(points);updateSummary(points)}});for(const id of ['activeOnly','below','low30','attention'])$(id).addEventListener('change',()=>{state.selected=null;$('detail').innerHTML='<div class="empty">Выберите объект.</div>';if(state.map){const points=renderMarkers();fitMap(points,true)}else{const points=filtered();renderList(points);updateSummary(points)}})}
  async function start(){bind();if(!window.ol){providerNote('OpenLayers не загрузился');$('loading').classList.add('hidden');$('error').innerHTML='<h2>Карта не загрузилась</h2><p>Не удалось загрузить библиотеку OpenLayers.</p>';$('error').classList.remove('hidden');return}try{state.data=await loadData();applyOptions();if(state.data.enabled===false){showList('Карта отзывов отключена');$('loading').classList.add('hidden');return}setLoad('Подключаю карту…',42,'Загружаю подложку Яндекс.');await initMap();setLoad('Рисую объекты…',82,state.providerNote);const points=renderMarkers();fitMap(points,false);await sleep(80);setLoad('Готово',100,'');$('loading').classList.add('done');setTimeout(()=>$('loading').classList.add('hidden'),220)}catch(e){console.error(e);showList('Карта недоступна · показан список объектов');$('loading').classList.add('hidden')}}
  start();
})();
</script>
</body>
</html>
