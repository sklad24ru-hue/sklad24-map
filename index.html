<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#243746">
  <link rel="preconnect" href="https://api-maps.yandex.ru" crossorigin>
  <link rel="preconnect" href="https://mapgl.2gis.com" crossorigin>
  <title>Мониторинг отзывов</title>
  <style>
    :root{--navy:#243746;--orange:#ff7200;--text:#243746;--muted:#71808a;--line:#dfe5e9}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font:13px/1.35 Arial,sans-serif;color:var(--text);background:#fff}
    body{overflow:hidden}
    .app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px}
    .map-wrap{position:relative;min-width:0;background:#edf1f3}
    #map{position:absolute;inset:0}
    .topbar{position:absolute;z-index:1000;left:14px;top:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
    .control{pointer-events:auto;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;box-shadow:0 2px 10px rgba(36,55,70,.08);display:flex;gap:7px;align-items:center}
    .control button{border:0;background:transparent;padding:6px 9px;border-radius:6px;color:var(--text);cursor:pointer;font-weight:700}
    .control button.active{background:var(--navy);color:#fff}
    .control label{white-space:nowrap}.control input{accent-color:var(--orange)}
    .sidebar{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-width:0}
    .side-head{padding:16px 18px;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;font-size:17px}.brand b{color:var(--orange)}
    .summary,.status{color:var(--muted);margin-top:5px;font-size:12px}
    .detail{padding:18px;overflow:auto;min-height:0}
    .empty{color:var(--muted);padding-top:28px;text-align:center}
    .name{font-size:19px;font-weight:800;margin-bottom:5px}
    .rating{display:flex;align-items:baseline;gap:8px;margin:12px 0}
    .rating strong{font-size:30px}.rating span{color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;margin:16px 0}
    .grid div:nth-child(odd){color:var(--muted)}
    .signal{border-radius:8px;padding:10px 12px;background:#fff3d6;color:#76590b;margin:12px 0}
    .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .links a{display:inline-block;text-decoration:none;border-radius:7px;padding:9px 11px;font-weight:700}
    .links .primary{background:var(--orange);color:#fff}.links .secondary{background:#eef2f4;color:var(--text)}
    .review-map-marker{background:transparent;border:0}
    .yandex-marker{transform:translate(-50%,-50%)}
    .marker{min-width:48px;height:38px;border:3px solid #fff;border-radius:21px;box-shadow:0 2px 8px rgba(0,0,0,.25);color:#fff;font:800 14px Arial;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;padding:2px 7px}
    .marker small{font-size:9px;font-weight:600;opacity:.92}
    .marker.green{background:#3f7d58}.marker.yellow{background:#c69728}.marker.orange{background:#d9772f}.marker.red{background:#b94a43}.marker.none{background:#77848d}
    .marker.selected{outline:3px solid var(--navy);outline-offset:2px}
    .fallback-list{position:absolute;inset:0;overflow:auto;padding:84px 14px 18px;background:#f4f6f7}
    .fallback-note{max-width:760px;margin:0 auto 12px;color:var(--muted);font-size:12px}
    .fallback-grid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
    .fallback-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;text-align:left;color:var(--text);cursor:pointer;min-height:70px}
    .fallback-card.selected{outline:3px solid var(--navy);outline-offset:1px}
    .fallback-card strong{display:block;font-size:14px;margin-bottom:5px}
    .fallback-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
    .fallback-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .fallback-dot.green{background:#3f7d58}.fallback-dot.yellow{background:#c69728}.fallback-dot.orange{background:#d9772f}.fallback-dot.red{background:#b94a43}.fallback-dot.none{background:#77848d}
    .loading{position:absolute;z-index:1300;inset:0;background:linear-gradient(145deg,#f7f9fa,#edf2f4);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .18s ease}
    .loading.done{opacity:0;pointer-events:none}
    .loader-card{width:min(430px,92%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 10px 32px rgba(36,55,70,.10);text-align:center}
    .spinner{width:42px;height:42px;margin:0 auto 16px;border-radius:50%;border:4px solid #e5eaed;border-top-color:var(--orange);animation:spin .8s linear infinite}
    .load-title{font-size:18px;font-weight:800}.load-sub{margin-top:7px;color:var(--muted);min-height:34px}
    .progress{height:7px;background:#edf1f3;border-radius:10px;overflow:hidden;margin-top:17px}.progress>div{height:100%;width:8%;background:var(--orange);transition:width .25s}
    .error{position:absolute;z-index:1400;inset:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;overflow:auto}
    .hidden{display:none!important}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
    @media(max-width:760px){
      html,body{height:auto;min-height:100%;overflow:auto}
      .app{display:block;height:auto;min-height:100vh}
      .map-wrap{height:64vh;min-height:430px}
      .sidebar{border-left:0;border-top:1px solid var(--line);min-height:36vh}
      .topbar{left:8px;right:8px;top:8px;gap:6px}
      .control{max-width:100%;overflow:auto;padding:6px 8px}
      .control label{font-size:12px}
      .side-head{padding:13px 15px}.detail{padding:15px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="map-wrap">
    <div id="map"></div>
    <div id="loading" class="loading">
      <div class="loader-card">
        <div class="spinner"></div>
        <div id="loadTitle" class="load-title">Подготавливаю карту…</div>
        <div id="loadSub" class="load-sub">Загружаю карту и готовый снимок данных.</div>
        <div class="progress"><div id="loadBar"></div></div>
      </div>
    </div>
    <div class="topbar">
      <div class="control" id="regions">
        <button data-region="all" class="active">Вся сеть</button>
        <button data-region="moscow">Москва</button>
        <button data-region="spb">СПб</button>
      </div>
      <div class="control">
        <label><input id="activeOnly" type="checkbox" checked> Только активные</label>
        <label><input id="below" type="checkbox"> Ниже цели</label>
        <label><input id="low30" type="checkbox"> Есть 1–3★ за 30 дней</label>
        <label><input id="attention" type="checkbox"> Требует внимания</label>
      </div>
    </div>
    <div id="error" class="error hidden"></div>
  </div>
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand">МОНИТОРИНГ ОТЗЫВОВ</div>
      <div id="summary" class="summary">Загрузка данных…</div>
      <div id="status" class="status"></div>
    </div>
    <div id="detail" class="detail"><div class="empty">После загрузки выберите объект на карте отзывов.</div></div>
  </aside>
</div>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id);
  const REGION_VIEW={
    moscow:{center:[37.6173,55.7558],zoom:9},
    spb:{center:[30.3159,59.9391],zoom:9}
  };
  const state={data:null,map:null,provider:null,markers:[],selected:null,region:'all',providerNote:''};

  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const setLoad=(title,pct,sub)=>{
    $('loadTitle').textContent=title;
    $('loadBar').style.width=Math.max(5,Math.min(100,Number(pct)||0))+'%';
    $('loadSub').textContent=sub||'';
  };
  const showError=(title,msg)=>{
    $('loading').classList.add('hidden');
    $('error').innerHTML='<h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p>'+
      '<p style="color:#71808a">Данные обновляются автоматически раз в 15 минут. Попробуйте обновить страницу чуть позже.</p>';
    $('error').classList.remove('hidden');
  };

  function applySnapshotOptions(){
    const o=state.data&&state.data.options||{};
    $('activeOnly').checked=o.activeOnly!==false;
    const region=['all','moscow','spb'].includes(String(o.region))?String(o.region):'all';
    state.region=region;
    [...$('regions').querySelectorAll('button[data-region]')].forEach(b=>b.classList.toggle('active',b.dataset.region===region));
  }
  function showDisabledMap(){
    $('loading').classList.add('hidden');
    $('summary').textContent='Мониторинг отзывов отключён';
    if(state.data&&state.data.generatedAt){
      const when=new Date(state.data.generatedAt);
      $('status').textContent='Состояние обновлено: '+when.toLocaleString('ru-RU');
    }else $('status').textContent='';
    $('detail').innerHTML='<div class="empty">Публикация внешнего мониторинга отзывов отключена в настройках.</div>';
    $('error').innerHTML='<h2>Мониторинг отзывов отключён</h2><p>Публикация мониторинга отзывов временно выключена администратором.</p>';
    $('error').classList.remove('hidden');
  }

  async function loadData(){
    setLoad('Получаю объекты…',22,'Читаю готовый снимок данных с GitHub Pages.');
    const response=await fetch('map-data.json',{cache:'no-cache'});
    if(!response.ok)throw Error('Не удалось получить map-data.json: HTTP '+response.status);
    const data=await response.json();
    if(data&&data.error)throw Error('Обновление данных завершилось ошибкой: '+data.error);
    if(!data||!Array.isArray(data.points)||!data.summary)throw Error('Файл данных карты имеет неверный формат.');
    return data;
  }

  function loadYandex(apiKey,timeout=14000){
    if(window.ymaps3)return Promise.resolve(window.ymaps3.ready);
    return new Promise((resolve,reject)=>{
      const el=document.createElement('script');let done=false;
      const finish=async err=>{
        if(done)return;done=true;clearTimeout(timer);
        if(err){try{el.remove()}catch(_){}reject(err);return;}
        try{
          if(!window.ymaps3)throw Error('Яндекс Maps API не инициализировался');
          await window.ymaps3.ready;
          resolve();
        }catch(e){reject(e);}
      };
      el.src='https://api-maps.yandex.ru/v3/?apikey='+encodeURIComponent(apiKey)+'&lang=ru_RU';
      el.async=true;
      el.onload=()=>finish();
      el.onerror=()=>finish(Error('Не удалось загрузить Яндекс Maps API'));
      const timer=setTimeout(()=>finish(Error('Таймаут загрузки Яндекс Maps API')),timeout);
      document.head.appendChild(el);
    });
  }

  function load2Gis(timeout=12000){
    if(window.mapgl)return Promise.resolve();
    return new Promise((resolve,reject)=>{
      const el=document.createElement('script');let done=false;
      const finish=err=>{
        if(done)return;done=true;clearTimeout(timer);
        if(err){try{el.remove()}catch(_){}reject(err);return;}
        window.mapgl?resolve():reject(Error('2ГИС MapGL не инициализировался'));
      };
      el.src='https://mapgl.2gis.com/api/js/v1';
      el.async=true;
      el.onload=()=>finish();
      el.onerror=()=>finish(Error('Не удалось загрузить 2ГИС MapGL'));
      const timer=setTimeout(()=>finish(Error('Таймаут загрузки 2ГИС MapGL')),timeout);
      document.head.appendChild(el);
    });
  }

  async function chooseProvider(){
    const o=state.data&&state.data.options||{};
    const yandexKey=String(o.yandexApiKey||'').trim();
    const gis2Key=String(o.gis2ApiKey||'').trim();

    if(yandexKey){
      setLoad('Загружаю Яндекс Карты…',44,'Подключаю основной картографический сервис.');
      try{
        await loadYandex(yandexKey);
        state.provider='yandex';
        state.providerNote='Яндекс Карты';
        return;
      }catch(e){
        console.warn('Yandex Maps failed; trying 2GIS:',e);
      }
    }

    if(gis2Key){
      setLoad('Загружаю 2ГИС…',52,'Основная карта недоступна. Подключаю резервную.');
      try{
        await load2Gis();
        state.provider='2gis';
        state.providerNote='Резервная карта · 2ГИС';
        return;
      }catch(e){
        console.warn('2GIS MapGL failed; using list mode:',e);
      }
    }

    state.provider='list';
    state.providerNote='Режим списка · карта временно недоступна';
  }

  function filtered(){
    const d=state.data;if(!d)return [];
    return d.points.filter(p=>{
      if(state.region!=='all'&&p.region!==state.region)return false;
      if($('activeOnly').checked&&!p.active)return false;
      if($('below').checked&&!(p.rating!=null&&p.rating<d.target))return false;
      if($('low30').checked&&!(p.low30>0))return false;
      if($('attention').checked&&!p.attention)return false;
      return true;
    });
  }
  const mapCoords=p=>[Number(p.coordinates[0]),Number(p.coordinates[1])];

  function clearMarkers(){
    if(state.provider==='yandex'&&state.map){
      for(const x of state.markers){try{state.map.removeChild(x.marker)}catch(_){}}
    }else if(state.provider==='2gis'){
      for(const x of state.markers){try{x.marker.destroy()}catch(_){}}
    }
    state.markers=[];
  }

  function paddedBounds(points){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of points){
      const cc=mapCoords(p);
      if(!Number.isFinite(cc[0])||!Number.isFinite(cc[1]))continue;
      minX=Math.min(minX,cc[0]);maxX=Math.max(maxX,cc[0]);
      minY=Math.min(minY,cc[1]);maxY=Math.max(maxY,cc[1]);
    }
    if(!Number.isFinite(minX))return null;
    const dx=Math.max((maxX-minX)*.12,.015),dy=Math.max((maxY-minY)*.12,.01);
    return [[minX-dx,minY-dy],[maxX+dx,maxY+dy]];
  }

  function fit(points,animate=true){
    if(!points.length||state.provider==='list')return false;
    if(state.provider==='yandex'){
      if(points.length===1){
        state.map.setLocation({center:mapCoords(points[0]),zoom:12,duration:animate?250:0,easing:'ease-in-out'});
        return true;
      }
      const bounds=paddedBounds(points);
      if(bounds)state.map.setLocation({bounds,duration:animate?300:0,easing:'ease-in-out'});
      return !!bounds;
    }
    if(state.provider==='2gis'){
      if(points.length===1){
        state.map.setCenter(mapCoords(points[0]),{duration:animate?250:0});
        state.map.setZoom(12,{duration:animate?250:0});
        return true;
      }
      const bounds=paddedBounds(points);
      if(bounds)state.map.fitBounds(
        {southWest:bounds[0],northEast:bounds[1]},
        {padding:{top:36,left:36,bottom:36,right:36},maxZoom:13}
      );
      return !!bounds;
    }
    return false;
  }

  function setPreset(view,animate=false){
    if(state.provider==='yandex'){
      state.map.setLocation({center:view.center,zoom:view.zoom,duration:animate?250:0,easing:'ease-in-out'});
    }else if(state.provider==='2gis'){
      state.map.setCenter(view.center,{duration:animate?250:0});
      state.map.setZoom(view.zoom,{duration:animate?250:0});
    }
  }

  function focusRegion(){
    const points=filtered();
    if(points.length){fit(points,true);return;}
    if(state.region!=='all'&&REGION_VIEW[state.region]){setPreset(REGION_VIEW[state.region]);return;}
    setPreset({center:[36,56.5],zoom:6});
  }

  function selectPoint(p){
    state.selected=p;
    for(const x of state.markers){
      const el=x.el;
      if(el)el.classList.toggle('selected',x.p.id===p.id);
      if(x.marker&&state.provider==='2gis'&&x.marker.setZIndex)try{x.marker.setZIndex(x.p.id===p.id?1000:100)}catch(_){}
    }
    if(state.provider==='list'){
      for(const el of document.querySelectorAll('.fallback-card[data-id]')){
        el.classList.toggle('selected',el.dataset.id===String(p.id));
      }
    }
    const rating=p.rating==null?'—':Number(p.rating).toFixed(1)+'★';
    $('detail').innerHTML=
      '<div class="name">'+esc(p.name)+'</div>'+
      '<div class="rating"><strong>'+rating+'</strong><span>'+(p.reviewCount==null?'нет данных':esc(p.reviewCount)+' отзывов')+'</span></div>'+
      '<div class="grid">'+
        '<div>Новых за 30 дней</div><b>'+Number(p.new30||0)+'</b>'+
        '<div>1–4★ за 30 дней</div><b>'+Number(p.below5_30||0)+'</b>'+
        '<div>1–3★ за 30 дней</div><b>'+Number(p.low30||0)+'</b>'+
        '<div>1–3★ без ответа</div><b>'+Number(p.lowNo||0)+'</b>'+
      '</div>'+
      (p.signal?'<div class="signal"><b>'+esc(p.signal)+'</b>'+(p.action?'<br>'+esc(p.action):'')+'</div>':'')+
      '<div class="links"><a class="primary" href="'+esc(p.url)+'" target="_blank" rel="noopener">Открыть Яндекс</a>'+
      '<a class="secondary" href="'+esc(p.reviewsUrl)+'" target="_blank" rel="noopener">Отзывы</a></div>';
  }

  function markerHtml(p,selected){
    return '<span>'+(p.rating==null?'—':Number(p.rating).toFixed(1))+'</span>'+
      (p.reviewCount==null?'':'<small>'+esc(p.reviewCount)+'</small>');
  }

  function addYandexMarker(p,selected){
    const el=document.createElement('div');
    el.className='marker yandex-marker '+(p.band||'none')+(selected?' selected':'');
    el.innerHTML=markerHtml(p,selected);
    el.title=p.name||'';
    el.setAttribute('role','button');
    el.tabIndex=0;
    el.addEventListener('click',()=>selectPoint(p));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPoint(p);}
    });
    const marker=new ymaps3.YMapMarker({
      coordinates:mapCoords(p),
      zIndex:selected?1000:100,
      hideOutsideViewport:true
    },el);
    state.map.addChild(marker);
    state.markers.push({marker,p,el});
  }

  function add2GisMarker(p,selected){
    const el=document.createElement('div');
    el.className='marker gis2-marker '+(p.band||'none')+(selected?' selected':'');
    el.innerHTML=markerHtml(p,selected);
    el.title=p.name||'';
    el.setAttribute('role','button');
    el.tabIndex=0;
    el.addEventListener('click',()=>selectPoint(p));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPoint(p);}
    });
    const marker=new mapgl.HtmlMarker(state.map,{
      coordinates:mapCoords(p),
      html:el,
      anchor:[29,21],
      interactive:true,
      preventMapInteractions:true,
      zIndex:selected?1000:100,
      labeling:{type:'invincible',width:58,height:42,offset:[-29,-21]}
    });
    state.markers.push({marker,p,el});
  }

  function renderList(points){
    const root=$('map');
    const cards=points.map(p=>{
      const rating=p.rating==null?'—':Number(p.rating).toFixed(1)+'★';
      const reviews=p.reviewCount==null?'нет данных':esc(p.reviewCount)+' отзывов';
      return '<button type="button" class="fallback-card'+(state.selected&&state.selected.id===p.id?' selected':'')+'" data-id="'+esc(p.id)+'">'+
        '<strong>'+esc(p.name)+'</strong>'+
        '<div class="fallback-meta"><span class="fallback-dot '+esc(p.band||'none')+'"></span><span>'+rating+'</span><span>·</span><span>'+reviews+'</span></div>'+
      '</button>';
    }).join('');
    root.innerHTML='<div class="fallback-list"><div class="fallback-note">Картографические сервисы временно недоступны. Данные и фильтры продолжают работать.</div><div class="fallback-grid">'+cards+'</div></div>';
    for(const el of root.querySelectorAll('.fallback-card[data-id]')){
      el.addEventListener('click',()=>{
        const p=points.find(x=>String(x.id)===el.dataset.id);
        if(p)selectPoint(p);
      });
    }
  }

  function render(doFocus=false){
    if(!state.data)return;
    if(state.provider!=='list'&&!state.map)return;
    clearMarkers();
    const points=filtered();
    if(state.provider==='list'){
      renderList(points);
    }else{
      for(const p of points){
        if(!Array.isArray(p.coordinates)||p.coordinates.length<2)continue;
        const selected=state.selected&&state.selected.id===p.id;
        if(state.provider==='yandex')addYandexMarker(p,selected);
        else if(state.provider==='2gis')add2GisMarker(p,selected);
      }
    }
    const sm=state.data.summary||{};
    $('summary').textContent=points.length+(state.provider==='list'?' в списке':' на карте')+' · '+Number(sm.total||state.data.points.length)+
      ' карточек всего · '+Number(sm.below||0)+' ниже '+Number(state.data.target||4.8).toFixed(1)+'★';
    const parts=[];
    if(state.data.generatedAt){
      const when=new Date(state.data.generatedAt);
      parts.push('Данные: '+when.toLocaleString('ru-RU'));
    }
    if(state.providerNote)parts.push(state.providerNote);
    $('status').textContent=parts.join(' · ');
    if(doFocus)focusRegion();
  }

  async function initYandexMap(){
    const {YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer}=ymaps3;
    state.map=new YMap(
      document.getElementById('map'),
      {location:{center:[37.6173,55.7558],zoom:8},theme:'light',showScaleInCopyrights:true},
      [new YMapDefaultSchemeLayer({}),new YMapDefaultFeaturesLayer({zIndex:1800})]
    );
    try{
      const {YMapZoomControl}=await ymaps3.import('@yandex/ymaps3-default-ui-theme');
      const controls=new ymaps3.YMapControls({position:'right'});
      controls.addChild(new YMapZoomControl({easing:'ease-in-out'}));
      state.map.addChild(controls);
    }catch(e){console.warn('Yandex zoom control unavailable:',e);}
  }

  function init2GisMap(){
    const key=String((state.data.options||{}).gis2ApiKey||'').trim();
    if(!key)throw Error('Ключ 2ГИС не настроен');
    state.map=new mapgl.Map('map',{
      key,
      center:[37.6173,55.7558],
      zoom:8,
      lang:'ru',
      zoomControl:true
    });
  }

  function resetMapContainer(){
    const node=$('map');
    try{if(state.map&&state.provider==='2gis'&&state.map.destroy)state.map.destroy()}catch(_){}
    state.map=null;
    state.markers=[];
    node.innerHTML='';
  }

  async function initMap(){
    if(state.provider==='yandex'){
      try{
        await initYandexMap();
        return;
      }catch(e){
        console.warn('Yandex map initialization failed; trying 2GIS:',e);
        resetMapContainer();
        const key=String((state.data.options||{}).gis2ApiKey||'').trim();
        if(key){
          try{
            await load2Gis();
            state.provider='2gis';
            state.providerNote='Резервная карта · 2ГИС';
            init2GisMap();
            return;
          }catch(e2){console.warn('2GIS initialization failed; using list mode:',e2);}
        }
        state.provider='list';
        state.providerNote='Режим списка · карта временно недоступна';
        return;
      }
    }
    if(state.provider==='2gis'){
      try{
        init2GisMap();
        return;
      }catch(e){
        console.warn('2GIS initialization failed; using list mode:',e);
        resetMapContainer();
        state.provider='list';
        state.providerNote='Режим списка · карта временно недоступна';
      }
    }
  }

  function bind(){
    $('regions').addEventListener('click',e=>{
      const b=e.target.closest('button[data-region]');if(!b)return;
      state.region=b.dataset.region;
      [...$('regions').querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x===b));
      state.selected=null;
      $('detail').innerHTML='<div class="empty">Выберите объект на карте отзывов.</div>';
      render(false);focusRegion();
    });
    for(const id of ['activeOnly','below','low30','attention']){
      $(id).addEventListener('change',()=>{
        state.selected=null;
        $('detail').innerHTML='<div class="empty">Выберите объект на карте отзывов.</div>';
        render(false);focusRegion();
      });
    }
  }

  async function start(){
    bind();
    try{
      setLoad('Подготавливаю карту…',8,'Загружаю интерфейс и снимок данных.');
      state.data=await loadData();
      applySnapshotOptions();
      if(state.data.enabled===false){showDisabledMap();return;}
      await chooseProvider();
      await initMap();
      const drawText=state.provider==='yandex'?'Создаю маркеры на Яндекс Картах.':
        state.provider==='2gis'?'Создаю маркеры на 2ГИС.':'Показываю резервный список объектов.';
      setLoad('Рисую объекты…',82,drawText);
      render(true);
      await sleep(80);
      setLoad('Готово',100,'');
      $('loading').classList.add('done');
      setTimeout(()=>$('loading').classList.add('hidden'),220);
    }catch(e){
      showError('Карта не загрузилась',e&&e.message||String(e));
    }
  }
  start();
})();
</script>
</body>
</html>
